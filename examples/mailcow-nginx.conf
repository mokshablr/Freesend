# Freesend behind mailcow's nginx. Copy to mailcow-dockerized/data/conf/nginx/freesend.conf
# (every *.conf there is auto-included), replace example.com, then:
#   mailcow.conf: ADDITIONAL_SAN=freesend.example.com,api.freesend.example.com
#   docker compose restart acme-mailcow nginx-mailcow
# Optional basic auth: openssl passwd -apr1 > data/conf/nginx/freesend.htpasswd, uncomment the two auth_basic lines. Use chmode 644 on the htpasswd file.

# resolve lazily so nginx still starts if freesend is down
resolver 127.0.0.11 valid=30s;

# Web UI, auth, dashboard
server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name freesend.example.com;
    ssl_certificate     /etc/ssl/mail/cert.pem;
    ssl_certificate_key /etc/ssl/mail/key.pem;

    # auth_basic "Freesend";
    # auth_basic_user_file /etc/nginx/conf.d/freesend.htpasswd;
    location / {
        set $up http://freesend:5000;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Public email API only. Bearer API key is checked by the app. (Unnessary if basic auth is not enabled)
server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name api.freesend.example.com;
    ssl_certificate     /etc/ssl/mail/cert.pem;
    ssl_certificate_key /etc/ssl/mail/key.pem;

    location ~ ^/(api/)?(send-email|emails)$ {
        set $up http://freesend:5000;
        rewrite ^/(send-email|emails)$ /api/$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { return 404; }
}
