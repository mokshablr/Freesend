services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:5000}
      LANDING_PAGE: ${LANDING_PAGE:-true}
      AUTH_SECRET: "${AUTH_SECRET:?generate with: openssl rand -base64 32}"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?generate with: openssl rand -base64 32}"
      ENCRYPTION_IV: "${ENCRYPTION_IV:?generate with: openssl rand -base64 16}"
      DATABASE_URL: postgresql://freesend:${POSTGRES_PASSWORD}@db:5432/freesend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freesend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: freesend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freesend"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
